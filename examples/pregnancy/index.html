<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daytiles: Pregnancy Calendar</title>
    <link rel="stylesheet" href="../../styles.css" />
    <link rel="stylesheet" href="../utils/config.css" />
    <script type="importmap">
      { "imports": { "daytiles": "../../dist/index.js" } }
    </script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2em auto; padding: 0 1em; }
      .legend { display: flex; flex-wrap: wrap; gap: 1em; margin: 1em 0; font-size: 0.9em; }
      .legend span { display: inline-flex; align-items: center; gap: 0.4em; }
      .swatch { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
      a { color: #0366d6; }
      .meta { color: #666; }
    </style>
  </head>
  <body>
    <p><a href="../">← All examples</a></p>
    <h1>Pregnancy Calendar</h1>
    <p class="meta">40 weeks from LMP. Each row is one week. Click an appointment for details.</p>
    <div class="legend">
      <span><i class="swatch" style="background:#bf5af2"></i> Ultrasound</span>
      <span><i class="swatch" style="background:#0a84ff"></i> Screening</span>
      <span><i class="swatch" style="background:#34c759"></i> Routine check</span>
      <span><i class="swatch" style="background:#ff453a"></i> Due date</span>
    </div>
    <svg id="calendar"></svg>
    <p id="info" class="meta"></p>
    <details class="config-box">
      <summary>Configuration</summary>
      <pre id="config"></pre>
    </details>
    <script type="module" src="pregnancy.js"></script>
  </body>
</html>
