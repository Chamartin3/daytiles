<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Daytiles: Interactive Example</title>
    <link
      rel="stylesheet"
      href="../../styles.css?v=3"
    />
    <link
      rel="stylesheet"
      href="example.css?v=3"
    />
    <link rel="stylesheet" href="../utils/config.css" />
    <script type="importmap">
      { "imports": { "daytiles": "../../dist/index.js" } }
    </script>
  </head>
  <body>
    <p><a href="../">← All examples</a></p>
    <main>
      <header>
        <h1>Daytiles</h1>
        <p>Tweak the settings, add events, and watch the calendar update.</p>
      </header>

      <section class="controls">
        <fieldset>
          <legend>Layout</legend>
          <label>Mode
            <select id="layout">
              <option value="month">month</option>
              <option value="week">week</option>
              <option value="weekday" selected>weekday</option>
              <option value="custom">custom</option>
            </select>
          </label>
          <label>Day size
            <input id="daySize" type="number" value="16" min="6" max="60" />
          </label>
          <label>Gap
            <input id="gap" type="number" value="4" min="0" max="20" />
          </label>
          <label>Days per row (custom)
            <input id="daysPerRow" type="number" value="21" min="1" max="60" />
          </label>
          <label>Start day of week
            <select id="startDayOfWeek">
              <option value="0">Sunday</option>
              <option value="1" selected>Monday</option>
              <option value="2">Tuesday</option>
              <option value="3">Wednesday</option>
              <option value="4">Thursday</option>
              <option value="5">Friday</option>
              <option value="6">Saturday</option>
            </select>
          </label>
        </fieldset>

        <fieldset>
          <legend>Colors</legend>
          <label>Today
            <input id="colorCurrent" type="color" value="#FFD700" />
          </label>
          <label>Day
            <input id="dayColor" type="color" value="#eeeeee" />
          </label>
          <label>Past fade
            <input id="pastFade" type="number" value="0.6" min="0" max="1" step="0.05" />
          </label>
          <label>Future fade
            <input id="futureFade" type="number" value="1" min="0" max="1" step="0.05" />
          </label>
          <label>Default event
            <input id="defaultEventColor" type="color" value="#ff5577" />
          </label>
        </fieldset>

        <fieldset>
          <legend>Highlights</legend>
          <h4 class="subhead">Alternation</h4>
          <label>Mode
            <select id="alternationMode">
              <option value="none">None</option>
              <option value="day">Per day</option>
              <option value="week">Per week</option>
              <option value="month" selected>Per month</option>
              <option value="custom">Custom days</option>
            </select>
          </label>
          <label id="alternationSizeLabel" hidden>Custom days
            <input id="alternationSize" type="number" value="7" min="1" max="365" />
          </label>
          <label id="alternationColorLabel">Color
            <input id="colorAlternation" type="color" value="#d2f0fa" />
          </label>
          <h4 class="subhead">Days &amp; months</h4>
          <label>Color
            <input id="highlightColor" type="color" value="#BAFFC9" />
          </label>
          <div class="hl-group">
            <span class="hl-label">Weekdays</span>
            <div id="highlightWeekdays" class="toggle-row"></div>
          </div>
          <div class="hl-group">
            <span class="hl-label">Months</span>
            <div id="highlightMonths" class="toggle-row"></div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Display</legend>
          <label>Shape
            <select id="shape">
              <option value="rect" selected>Rectangle</option>
              <option value="roundedRect">Rounded</option>
              <option value="circle">Circle</option>
              <option value="diamond">Diamond</option>
            </select>
          </label>
          <label class="checkbox">
            <input id="highlightCurrent" type="checkbox" checked />
            Highlight today
          </label>
          <label class="checkbox">
            <input id="showLabels" type="checkbox" />
            Show row labels
          </label>
          <label class="checkbox">
            <input id="heatmap" type="checkbox" checked />
            Heatmap
          </label>
          <label>Heatmap low fade
            <input id="heatmapLow" type="number" value="0.2" min="0" max="1" step="0.05" />
          </label>
          <label>Heatmap high fade
            <input id="heatmapHigh" type="number" value="0.35" min="0" max="1" step="0.05" />
          </label>
        </fieldset>

        <fieldset>
          <legend>Range</legend>
          <label>Start
            <input id="startDate" type="date" />
          </label>
          <label>End
            <input id="endDate" type="date" />
          </label>
          <div class="presets">
            <span class="presets-title">Presets</span>
            <button type="button" data-preset="month">This month</button>
            <button type="button" data-preset="quarter">This quarter</button>
            <button type="button" data-preset="year">This year</button>
          </div>
        </fieldset>

        <fieldset class="event-types-card">
          <legend>Event types</legend>
          <div class="type-form">
            <label>Name
              <input id="typeName" type="text" placeholder="work" />
            </label>
            <label>Color
              <input id="typeColor" type="color" value="#5577ff" />
            </label>
            <button id="addType" type="button">Add type</button>
          </div>
          <ul id="typeList"></ul>
        </fieldset>

      </section>

      <section class="canvas">
        <svg id="calendar" width="100%" height="600"></svg>
      </section>

      <section class="events">
        <fieldset class="add-event-card">
          <legend>Add event</legend>
          <div class="event-form">
            <label>From
              <input id="eventStart" type="date" />
            </label>
            <label>To (optional)
              <input id="eventEnd" type="date" />
            </label>
            <label>Type
              <select id="eventType">
                <option value="">(default)</option>
              </select>
            </label>
            <label>Note
              <input id="eventNote" type="text" placeholder="Vacation" />
            </label>
            <button id="addEvent" type="button">Add</button>
          </div>
          <ul id="eventList"></ul>
        </fieldset>

      </section>

      <details class="config-box">
        <summary>Configuration</summary>
        <pre id="config"></pre>
      </details>
    </main>

    <script type="module" src="example.js?v=3"></script>
  </body>
</html>
