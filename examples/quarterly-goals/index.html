<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daytiles: Quarterly Goals</title>
    <link rel="stylesheet" href="../../styles.css" />
    <style>
      body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2em auto; padding: 0 1em; }
      .legend { display: flex; flex-wrap: wrap; gap: 1em; margin: 1em 0; font-size: 0.9em; }
      .legend span { display: inline-flex; align-items: center; gap: 0.4em; }
      .swatch { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
      a { color: #0366d6; }
      .meta { color: #666; min-height: 1.4em; }
    </style>
  </head>
  <body>
    <p><a href="../">← All examples</a></p>
    <h1>Q3 2026: Goals &amp; Milestones</h1>
    <p class="meta">Sprint reviews, checkpoints, and quarterly retrospectives. Click for details.</p>
    <div class="legend">
      <span><i class="swatch" style="background:#34c759"></i> Kickoff</span>
      <span><i class="swatch" style="background:#0a84ff"></i> Sprint review</span>
      <span><i class="swatch" style="background:#ff9500"></i> Checkpoint</span>
      <span><i class="swatch" style="background:#bf5af2"></i> Review / retro</span>
      <span><i class="swatch" style="background:#ff453a"></i> Freeze</span>
    </div>
    <svg id="calendar"></svg>
    <p id="info" class="meta"></p>
    <details class="config-box">
      <summary>Configuration</summary>
      <pre id="config"></pre>
    </details>
    <script type="module" src="goals.js"></script>
  </body>
</html>
