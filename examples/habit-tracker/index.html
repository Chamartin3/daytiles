<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daytiles: Habit Tracker</title>
    <link rel="stylesheet" href="../../styles.css" />
    <style>
      body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 2em auto; padding: 0 1em; }
      .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; margin-right: 0.4em; vertical-align: middle; }
      #trackers { overflow-x: auto; overflow-y: hidden; height: auto; padding-bottom: 0.4em; }
      .tracker-row { display: flex; align-items: center; gap: 0.8em; margin: 0; flex-wrap: nowrap; line-height: 1; width: max-content; }
      .tracker-row svg { flex: none; max-width: none !important; display: block; }
      .tracker-label { width: 100px; flex: none; font-size: 0.75em; color: #333; display: flex; align-items: center; position: sticky; left: 0; background: #fff; z-index: 1; }
      .swatch { width: 10px; height: 10px; }
      a { color: #0366d6; }
    </style>
  </head>
  <body>
    <p><a href="../">← All examples</a></p>
    <h1>Habit Tracker</h1>
    <p>Combining three Daytiles instances: one per habit: stacked into a single scrollable view across Q1 2025.</p>
    <div id="trackers"></div>
    <details class="config-box">
      <summary>Configuration</summary>
      <pre id="config"></pre>
    </details>
    <script type="module" src="habits.js"></script>
  </body>
</html>
