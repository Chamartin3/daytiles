<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daytiles — Habit Tracker</title>
    <link rel="stylesheet" href="../../styles.css" />
    <style>
      body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 2em auto; padding: 0 1em; }
      .legend { display: flex; gap: 1.2em; margin: 1em 0; font-size: 0.9em; }
      .legend span { display: inline-flex; align-items: center; gap: 0.4em; }
      .swatch { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
      a { color: #0366d6; }
    </style>
  </head>
  <body>
    <p><a href="../">← All examples</a></p>
    <h1>Habit Tracker</h1>
    <p>Last 60 days. Each row is a weekday; columns advance once per week.</p>
    <div class="legend">
      <span><i class="swatch" style="background:#34c759"></i> Workout</span>
      <span><i class="swatch" style="background:#0a84ff"></i> Reading</span>
      <span><i class="swatch" style="background:#ff9500"></i> Both</span>
    </div>
    <svg id="calendar"></svg>
    <script type="module" src="habits.js"></script>
  </body>
</html>
